<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florian Dehm</title>
<meta name="description" content="Florian Dehm — software engineering apprentice at Deutsche Börse, Frankfurt. Backend systems and C++.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-theme="light">

  <div class="orbs" aria-hidden="true">
    <div class="orb orb-a" id="orbA"></div>
    <div class="orb orb-b" id="orbB"></div>
    <div class="orb orb-c" id="orbC"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">FD</div>
        <span class="brand-name">Florian Dehm</span>
      </div>

      <nav class="tabs" id="tabs"></nav>

      <div class="header-actions">
        <button class="btn-lang" id="langToggle" title="Sprache wechseln"></button>
        <button class="btn-theme" id="themeToggle" title="Theme"></button>
      </div>
    </div>
  </header>

  <main class="main">

    <section class="section" id="section-home" data-section="home">
      <div class="hero">
        <div class="pill" id="statusPill"><span class="pill-dot"></span><span id="statusPillText"></span></div>
        <h1 id="heroTitle"></h1>
        <p class="hero-body" id="heroBody"></p>
        <div class="hero-actions">
          <a href="mailto:florian@dehm-online.de" class="btn-primary" id="ctaMail"></a>
          <a href="https://github.com/DonckyTM" target="_blank" rel="noreferrer" class="btn-secondary">GitHub</a>
        </div>
      </div>

      <div class="facts" id="facts"></div>

      <div class="now-card">
        <div class="now-copy">
          <div class="eyebrow" id="nowLabel"></div>
          <div class="now-title" id="nowTitle"></div>
          <p class="now-body" id="nowBody"></p>
        </div>
        <button class="btn-outline" id="goCurrent"></button>
      </div>
    </section>

    <section class="section" id="section-about" data-section="about">
      <h2 id="aboutTitle"></h2>
      <div class="about-grid">
        <div class="about-copy">
          <p id="aboutP1"></p>
          <p class="muted" id="aboutP2"></p>
          <p class="muted" id="aboutP3"></p>
        </div>
        <div class="about-rows" id="aboutRows"></div>
      </div>

      <div class="stack-block">
        <div class="eyebrow" id="stackLabel"></div>
        <div class="stack-tags" id="stackTags"></div>
      </div>
    </section>

    <section class="section" id="section-projects" data-section="projects">
      <h2 id="projectsTitle"></h2>
      <p class="section-intro" id="projectsIntro"></p>

      <div class="projects-grid" id="projectsGrid">
        <div class="empty-card">
          <div class="empty-title" id="emptyTitle"></div>
          <p class="empty-body" id="emptyBody"></p>
        </div>
      </div>
    </section>

    <section class="section" id="section-current" data-section="current">
      <div class="current-heading">
        <h2 id="currentTitle"></h2>
        <span class="updated" id="updated"></span>
      </div>
      <p class="section-intro" id="currentIntro"></p>

      <div class="progress-card">
        <div class="progress-head">
          <span class="progress-label" id="progressLabel"></span>
          <span class="progress-text" id="progressText"></span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="milestones" id="milestones"></div>
      </div>

      <div class="learning-card">
        <div class="eyebrow" id="learningLabel"></div>
        <p class="learning-body" id="learningBody"></p>
      </div>
    </section>

  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-shot">
        <span class="shot-tag" id="modalShot"></span>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <h3 id="modalTitle"></h3>
        <div class="modal-meta">
          <div class="modal-meta-cell">
            <div class="eyebrow" id="modalYearLabel"></div>
            <div class="modal-meta-val" id="modalYear"></div>
          </div>
          <div class="modal-meta-cell modal-meta-wide">
            <div class="eyebrow" id="modalRoleLabel"></div>
            <div class="modal-meta-val" id="modalRole"></div>
          </div>
        </div>
        <p id="modalLong1"></p>
        <p class="muted" id="modalLong2"></p>
        <div class="eyebrow" id="modalTechLabel"></div>
        <div class="modal-tech" id="modalTech"></div>
        <div class="modal-actions">
          <a href="#" target="_blank" rel="noreferrer" class="btn-primary" id="modalRepo"></a>
          <button class="btn-outline" id="modalCloseBtn2"></button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2026 Florian Dehm · Frankfurt am Main</span>
      <div class="footer-links">
        <a href="mailto:florian@dehm-online.de">florian@dehm-online.de</a>
        <a href="https://github.com/DonckyTM" target="_blank" rel="noreferrer">github.com/DonckyTM</a>
      </div>
    </div>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
